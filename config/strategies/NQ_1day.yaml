# Confluence strategy parameters for NQ (E-mini Nasdaq-100 futures), daily bars.
# Same starting defaults as GC_1day.yaml — not yet instrument-tuned.

symbol: NQ
timeframe: "1 day"

fractal_n: 2

range_window: 20
range_max_pct: 0.05
range_min_bars: 10

retracement_zone: [0.5, 0.786]
target_extension_ratio: 1.618
stop_buffer_pct: 0.005
