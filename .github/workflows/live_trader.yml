name: Live trader (Binance Futures Testnet)

on:
  schedule:
    # 00:05 UTC daily -- shortly after Binance's daily candle close (00:00 UTC)
    - cron: "5 0 * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" click for testing

permissions:
  contents: write # needed to commit the updated state/trade-log files back to the repo

jobs:
  run-live-trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live trader
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        run: python live/live_trader.py

      - name: Commit updated state and trade log
        run: |
          git config user.name "live-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/state/ live/output/
          git diff --cached --quiet || git commit -m "Live trader run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
