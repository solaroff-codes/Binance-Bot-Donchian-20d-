name: Live trader (Binance Futures Testnet)

# The scheduled (cron) trigger this workflow originally had is REMOVED,
# not just unused: confirmed directly (HTTP 451 "Unavailable For Legal
# Reasons" on every symbol, including the public market-data endpoint,
# not just the authenticated futures API) that Binance blocks GitHub
# Actions runners' IP range entirely. A scheduled trigger here would only
# ever fail and spam daily failure-notification emails for something
# that structurally cannot succeed. Automation moved to a local machine
# instead (Windows Task Scheduler -- see live/README.md's "Automating
# it" section, same pattern as paper/paper_trader.py's), which uses a
# residential IP Binance doesn't block. workflow_dispatch (manual
# trigger) is kept in case this is ever revisited from non-blocked
# hosting -- not deleted, since the finding itself (and how it was
# reached) is worth keeping visible rather than quietly removed.
on:
  workflow_dispatch: {}

permissions:
  contents: write # needed to commit the updated state/trade-log files back to the repo

jobs:
  run-live-trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live trader
        env:
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        run: python live/live_trader.py

      - name: Commit updated state and trade log
        run: |
          git config user.name "live-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/state/ live/output/
          git diff --cached --quiet || git commit -m "Live trader run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
